# =====================================================================
#  Rutas de la app: cualquier dirección que no sea un archivo → index.html
# =====================================================================
#  Desde el 2026-11-26 cada vista de Gestorix tiene su dirección:
#  /historial, /maestros, /maestro/<nombre>, /horario, /optativas y
#  /calendario (src/rutas.js). Ninguna existe como archivo en el disco, así
#  que sin esto Apache contestaría 404 al abrirlas directo o al recargar.
#
#  La app se sirve siempre con index.html y el enrutador del navegador
#  decide qué pintar. index.html lleva <base href="/">, que es lo que evita
#  que en /maestro/x el navegador pida /maestro/styles.css.
#
#  Por qué FallbackResource y no RewriteRule: este archivo se carga en el
#  contexto del servidor, y mod_rewrite **no hereda** sus reglas dentro de
#  los VirtualHost (el 000-default de Debian es uno). FallbackResource vive
#  en el contexto de <Directory>, que sí aplica. Se probó: con RewriteRule
#  aquí, /historial seguía dando 404.
#
#  Lo que NO se desvía:
#   · lo que sí existe en el disco (styles.css, los .js, favicon.svg,
#     robots.txt, manifest.webmanifest, los PDF de materias/…);
#   · /api/: un endpoint mal escrito debe contestar 404 de verdad y no una
#     página HTML con código 200, que confundiría al front y a quien depure.
#
#  Queda un caso raro sin consecuencias: /maestro/styles.css contesta la app
#  en vez de 404. Con <base href="/"> el navegador nunca pide algo así.
# =====================================================================

<Directory /var/www/html>
    FallbackResource /index.html
</Directory>

<Directory /var/www/html/api>
    FallbackResource disabled
</Directory>
