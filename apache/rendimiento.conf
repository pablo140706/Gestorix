# =====================================================================
#  Rendimiento: comprimir también el JSON de la API
# =====================================================================
#  Medido el 2026-11-26: una visita bajaba ~708 KB de API **sin comprimir**.
#  El CSS y los .js sí se comprimían (87 KB → 17 KB), pero la lista de
#  mod_deflate que trae Debian no incluye application/json, que es
#  justamente donde está el peso:
#
#      api/historial.php  336 KB      api/horarios.php  204 KB
#      api/cupos.php       86 KB      api/links.php      29 KB
#      api/planes.php      27 KB      api/metricas.php   20 KB
#
#  JSON comprime muy bien (son los mismos nombres y claves repetidos), así
#  que esto se nota sobre todo en celular y por ngrok, donde la subida de
#  la casa es el cuello de botella.
#
#  También el SVG y el manifiesto, que son texto y hoy van tal cual.
# =====================================================================

<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE application/json
    AddOutputFilterByType DEFLATE image/svg+xml
    AddOutputFilterByType DEFLATE application/manifest+json
</IfModule>
