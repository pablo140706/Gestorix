# =====================================================================
#  Seguridad de Apache para Gestorix (lo copia el Dockerfile).
# =====================================================================

# No decirle a nadie qué versión de Apache corre.
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    # Sin listado de carpetas (p. ej. /materias/ no enseña todos los PDFs).
    Options -Indexes
    AllowOverride None
</Directory>

# lib/ solo la usan los endpoints por dentro: nadie la abre desde fuera.
<Directory /var/www/html/lib>
    Require all denied
</Directory>

# El navegador no adivina tipos de archivo (un .txt no se ejecuta como JS).
Header always set X-Content-Type-Options "nosniff"
# Nadie mete Gestorix dentro de su página para engañar clics.
Header always set X-Frame-Options "DENY"
# A otros sitios no se les manda la URL completa de donde vienes.
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"

# CSP: solo corre JavaScript que venga de archivos de este mismo sitio.
# Si alguien lograra colar <script> o un onclick="…" en un comentario o un
# alias, el navegador se niega a ejecutarlo. Es la segunda barrera: la
# primera es que el front escapa todo con esc().
#   style-src 'unsafe-inline': la rejilla del horario pinta colores con style="…"
#   (un estilo no ejecuta código). Las fuentes vienen de Google Fonts.
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

# Los PDF de los programas van sin CSP: algunos visores de PDF del
# navegador no abren con ella.
<FilesMatch "\.pdf$">
    Header always unset Content-Security-Policy
</FilesMatch>
